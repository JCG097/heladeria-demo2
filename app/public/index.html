<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heladeria-demo2</title>
  <style>
    :root { --fondo: #f4f5f7; --tinta: #1c1f22; --gris: #5f666d; --acento: #2f5bd3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fondo); color: var(--tinta); line-height: 1.5;
    }
    main { max-width: 560px; padding: 32px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { margin: 0; color: var(--gris); }
    .estado { display: inline-block; margin-top: 24px; padding: 6px 12px; border-radius: 999px;
      background: #e3e9fb; color: var(--acento); font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1 data-testid="titulo-app">Heladeria v2</h1>
    <p>Elige tu sabor y pide tu helado.</p>
    <form data-testid="formulario-pedido">
      <select data-testid="selector-sabor">
        <option value="fresa">Fresa</option>
      </select>
      <button type="submit" data-testid="boton-pedir">Pedir helado</button>
    </form>
    <p class="estado" data-testid="resultado-pedido"></p>
  </main>
  <script>
    const formulario = document.querySelector('[data-testid="formulario-pedido"]');
    const selectorSabor = document.querySelector('[data-testid="selector-sabor"]');
    const resultado = document.querySelector('[data-testid="resultado-pedido"]');

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      resultado.textContent = '';

      try {
        const respuesta = await fetch('/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sabor: selectorSabor.value }),
        });
        const datos = await respuesta.json();

        if (!respuesta.ok) {
          resultado.textContent = datos.error;
          return;
        }

        resultado.textContent = `El helado de ${datos.sabor} está disponible para su compra.`;
      } catch {
        resultado.textContent = 'No se pudo conectar con el servidor. Intenta de nuevo.';
      }
    });
  </script>
</body>
</html>
